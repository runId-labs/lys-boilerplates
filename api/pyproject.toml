[project]
# TODO: Update project name
name = "myapp_api"
version = "0.0.1"
description = ""
authors = []
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "runid-lys[all]>=0.1.0,<1.0.0",
    "python-json-logger>=3.0.0,<4.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-xdist", "import-linter"]

[tool.importlinter]
# Import boundaries for the back (see agents/guides/back/rules.md).
# Run: docker compose exec api lint-imports
#
# Rule: project code never imports lys entities/services directly — everything
# goes through app_manager.get_entity / get_service.
# Exceptions (documented in rules.md): fixtures generics and override
# subclasses — allow them with `ignore_imports = ["*.fixtures -> lys.apps"]`
# when they appear.
# When you create your project app package (e.g. myapp/), add it to
# root_packages and to every contract's source_modules.

root_packages = ["src", "lys"]

[[tool.importlinter.contracts]]
name = "Project code must not import lys components directly (use app_manager)"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["lys.apps.*.modules.*.entities", "lys.apps.*.modules.*.services"]
