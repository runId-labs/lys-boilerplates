type Mutation {
  """
  Improve text using AI (fix spelling, clarify, keep meaning).
  ACCESS LEVELS: CONNECTED
  LICENCE FREE
  """
  improveText(inputs: ImproveTextInput!): ImprovedTextNode!

  """
  Send a message to the AI assistant. Returns AI response with optional tool execution results.
  ACCESS LEVELS: CONNECTED
  LICENCE FREE
  """
  sendAiMessage(inputs: AIMessageInput!): AIMessageNode!

  """
  Record the connected user's consent for the specific version shown.
  ACCESS LEVELS: CONNECTED
  LICENCE FREE
  """
  acceptLegalDocument(versionId: ID!): LegalDocumentAcceptanceNode!

  """
  Add a user to their organization's subscription (grant license). Accessible to license administrators.
  ACCESS LEVELS: ROLE, ORGANIZATION_ROLE
  LICENCE FREE
  """
  addClientUserToSubscription(id: ID!): UserNode!

  """
  Remove a user from their organization's subscription (revoke license). Accessible to license administrators.
  ACCESS LEVELS: ROLE, ORGANIZATION_ROLE
  LICENCE FREE
  """
  removeClientUserFromSubscription(id: ID!): UserNode!

  """
  Remove the discount a subscription benefits from
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  revokeSubscriptionDiscount(id: ID!): SubscriptionNode!

  """
  Place a subscription on a plan billed outside the application
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  subscribeClientManually(id: ID!, input: SubscribeManuallyInput!): SubscriptionNode!

  """
  Change how a subscription is collected
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  setSubscriptionBillingMode(id: ID!, billingModeId: String!): SubscriptionNode!

  """
  Subscribe to a plan (handles new subscription, upgrade, and downgrade)
  ACCESS LEVELS: ROLE, ORGANIZATION_ROLE
  LICENCE FREE
  """
  subscribeToPlan(input: SubscribeToPlanInput!): SubscribeToPlanResultNode!

  """
  Cancel subscription (takes effect at end of current period)
  ACCESS LEVELS: ROLE, ORGANIZATION_ROLE
  LICENCE FREE
  """
  cancelSubscription: CancelSubscriptionResultNode!

  """
  Declare a discount the catalogue can offer
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  createLicenseDiscount(input: CreateDiscountInput!): LicenseDiscountNode!

  """
  Offer or withdraw a discount
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  setLicenseDiscountEnabled(id: ID!, enabled: Boolean!): LicenseDiscountNode!

  """
  Publish a new version of a plan, with its prices
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  createLicensePlanVersion(input: CreatePlanVersionInput!): LicensePlanVersionNode!

  """
  Set the limit of a rule on a plan version
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  setLicensePlanVersionRule(input: SetPlanVersionRuleInput!): LicensePlanVersionRuleNode!

  """
  Enable or disable a plan version
  ACCESS LEVELS: ROLE
  LICENCE FREE
  """
  setLicensePlanVersionEnabled(id: ID!, enabled: Boolean!): LicensePlanVersionNode!

  """
  Remove an SSO link by ID. Only the owning user can delete their own links.
  ACCESS LEVELS: OWNER
  LICENCE FREE
  ACCESS LEVELS: OWNER
  LICENCE FREE
  """
  deleteSsoLink(id: ID!): SuccessNode!

  """
  Create a new organization with owner account. Required: client_name, email, password, language_code. Optional: first_name, last_name, gender_code.
  PUBLIC
  LICENCE FREE
  """
  createClient(inputs: CreateClientInput!): ClientNode!

  """
  Create a new organization with SSO-authenticated owner. Required: sso_token, client_name, language_code.
  PUBLIC
  LICENCE FREE
  """
  createClientWithSso(inputs: CreateClientWithSSOInput!): ClientNode!

  """
  Update organization name. Required: id (organization ID), inputs.name (new name).
  ACCESS LEVELS: ROLE, ORGANIZATION_ROLE
  LICENCE FREE
  """
  updateClient(id: ID!, inputs: UpdateClientInput!): ClientNode!

  """
