[project]
name = "myapp_worker"
version = "0.0.1"
description = "Celery worker for the lys boilerplate"
license = { file = "../LICENSE" }
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "runid-lys[all]>=0.1.0,<1.0.0",
    "celery[redis]>=5.3.0,<6.0.0",
    "python-json-logger>=3.0.0,<4.0.0",
    "sentry-sdk[celery]>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-xdist"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker", "settings"]
